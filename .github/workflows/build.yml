name: Build desktop apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            bundles: dmg
          - name: macOS Intel
            os: macos-15-intel
            bundles: dmg
          - name: Windows x64
            os: windows-latest
            bundles: msi,nsis
          - name: Linux x64
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev rpm patchelf \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Build Tauri application
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: duolingo-desktop-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
