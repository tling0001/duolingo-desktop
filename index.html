<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#58cc02" />
  <meta name="description" content="Duolingo for desktop, powered by the official Duolingo web experience." />
  <title>Duolingo</title>
</head>
<body>
  <main class="launch" aria-live="polite">
    <div class="brand" aria-label="Duolingo">
      <div class="mascot" aria-hidden="true">Duo</div>
      <div class="wordmark">duolingo</div>
    </div>
    <div class="loader" role="status" aria-label="Opening Duolingo"><span></span></div>
    <p class="message">Loading your learning adventure…</p>
    <a class="fallback" href="https://www.duolingo.com/">Continue to Duolingo</a>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
